<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="都バス運行案内サイト PoC - ArcGIS GeoJSONリアルタイム版">
  <title>都バス運行案内サイト PoC (ArcGIS GeoJSON Demo)</title>
  <link rel="icon" href="/app/favicon.png" type="image/png">
  <link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/light/main.css">
  <style>
    :root {
      --bg: #f6f8fb;
      --panel: #ffffff;
      --border: #d0d7de;
      --text: #24292f;
      --muted: #57606a;
      --accent: #1a7f37;
      --topbar-height: 56px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; background: var(--bg); color: var(--text); }
    #topbar {
      height: var(--topbar-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    #title { font-size: 1rem; font-weight: 700; }
    #title span { color: var(--accent); }
    #meta { font-size: 0.8rem; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
    #viewDiv { width: 100%; height: calc(100% - var(--topbar-height)); }
  </style>
</head>
<body>
  <header id="topbar">
    <div id="title">都バス運行案内 <span>ArcGIS Demo</span></div>
    <div id="meta">
      <span>更新間隔: 30秒</span>
      <span id="route-filter">系統: 全件</span>
      <span id="layer-url">Layer URL: /api/gtfs/realtime/vehicles.geojson</span>
    </div>
  </header>
  <div id="viewDiv" aria-label="ArcGIS地図"></div>
  <script src="https://js.arcgis.com/4.30/"></script>
  <script src="js/arcgis-demo.js"></script>
</body>
</html>
